name: seller-saathi
services:
  app:
    image: ${APP_IMAGE:-seller-saathi:deployment}
    build:
      context: ../..
      target: runtime
    env_file:
      - ${APP_ENV_FILE:-../../.env}
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      DATA_DIR: /data
      MOCK_DATA_DIR: /app/data
      NODE_OPTIONS: --max-old-space-size=384
    expose: ['3000']
    networks: [backend]
    volumes: [kamdata:/data]
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 700m
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, scripts/healthcheck.mjs]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    logging: &rotation
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the approved DNS hostname}
      TRUSTED_PROXY_TOKEN: ${TRUSTED_PROXY_TOKEN:?Set the same private proxy token as the app}
    ports: ['80:80', '443:443']
    networks: [backend]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    logging: *rotation
networks:
  backend:
    driver: bridge
volumes:
  kamdata:
  caddydata:
  caddyconfig:
